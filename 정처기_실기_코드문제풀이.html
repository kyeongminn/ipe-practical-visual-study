ce of Errors Fallacy"]},{"a":["살충제 패러독스","살충제 역설","Pesticide Paradox"]},{"a":["파레토 법칙","결함 집중","파레토","Pareto"]}],"expl":"이 밖에 \"테스팅은 정황에 의존한다\", \"완벽한 테스트는 불가능하다\", \"테스트는 계획부터 시작\" 등의 원리가 있다."},{"id":125,"src":"extra","type":"blank","lang":"이론","ch":7,"title":"시간 복잡도","ask":"다음 알고리즘의 평균 시간 복잡도를 빅오(Big-O) 표기법으로 쓰시오.","body":"① 버블 정렬\n② 이진 탐색","blanks":[{"a":["O(n²)","O(n^2)","O(n2)","O(n*n)"]},{"a":["O(log n)","O(log2 n)","O(logn)","O(log₂n)"]}],"expl":"O(1) \u003c O(log n) \u003c O(n) \u003c O(n log n) \u003c O(n²) \u003c O(2ⁿ). 버블·선택·삽입 정렬은 O(n²), 퀵·힙·합병 정렬은 O(n log n)."},{"id":126,"src":"extra","type":"blank","lang":"이론","ch":7,"title":"클린 코드 원칙","ask":"다음 설명에 해당하는 클린 코드 작성 원칙을 쓰시오.","body":"① 한 번에 한 가지를 처리하도록 코드를 작성하고 클래스/메소드/함수를 최소 단위로 분리한다.\n② 상위 클래스/메소드/함수에서는 간략하게 애플리케이션의 특성을 나타내고, 상세 내용은 하위 클래스/메소드/함수에서 구현한다.","blanks":[{"a":["단순성"]},{"a":["추상화"]}],"expl":"클린 코드 원칙: 가독성, 단순성, 의존성 배제, 중복성 최소화, 추상화."},{"id":127,"src":"extra","type":"blank","lang":"이론","ch":7,"title":"리팩토링","ask":"다음 설명에 해당하는 용어를 쓰시오.","body":"소프트웨어의 기능(외부 동작)은 변경하지 않으면서 내부 구조를 개선하여 코드의 가독성과 유지보수성을 높이는 작업이다.","blanks":[{"a":["리팩토링","리팩터링","Refactoring"]}],"expl":"리팩토링 대상이 되는 냄새 나는 코드: 중복 코드, 긴 메소드, 큰 클래스, 긴 매개변수 목록 등."},{"id":128,"src":"extra","type":"blank","lang":"이론","ch":7,"title":"순환 복잡도","ask":"다음 물음에 답하시오.","body":"① 화이트박스 테스트 기법 중, 대상 프로그램의 제어 흐름 그래프를 분석하여 논리적 복잡성을 측정하고 기본 실행 경로를 정의하는 기법\n② 제어 흐름 그래프의 간선(Edge) 수가 9, 노드(Node) 수가 7일 때 맥케이브 순환 복잡도","blanks":[{"a":["기초 경로 검사","기초 경로 테스트","기본 경로 검사","기초 경로","Base Path Testing","Basis Path Testing"]},{"a":["4"]}],"expl":"순환 복잡도 V(G) = E - N + 2 = 9 - 7 + 2 = 4. (영역 수로 세도 된다: 닫힌 영역 + 1)"},{"id":129,"src":"extra","type":"sql","lang":"SQL","ch":8,"title":"SELECT · ORDER BY","ask":"[학생] 테이블에서 학과가 '컴퓨터'인 학생의 이름과 점수를 점수가 높은 순서로 검색하는 SQL문을 작성하시오.","tables":[{"name":"[학생]","cols":["학번","이름","학과","학년","점수"],"rows":[[2301,"김민수","컴퓨터",3,85],[2302,"이서연","전자",2,92],[2303,"박지훈","컴퓨터",4,78],[2304,"최유나","경영",3,95],[2305,"정하늘","전자",3,67],[2306,"한도윤","컴퓨터",2,89]]}],"model":"SELECT 이름, 점수 FROM 학생 WHERE 학과 = '컴퓨터' ORDER BY 점수 DESC;","accept":["SELECT 이름, 점수 FROM 학생 WHERE 학과='컴퓨터' ORDER BY 점수 DESC"],"expl":"정렬은 ORDER BY, 내림차순은 DESC(오름차순 ASC는 생략 가능). 문자열은 작은따옴표로 감싼다."},{"id":130,"src":"extra","type":"blank","lang":"SQL","ch":8,"title":"SQL 결과: COUNT","ask":"다음 SQL문의 실행 결과를 쓰시오.","tables":[{"name":"[학생]","cols":["학번","이름","학과","학년","점수"],"rows":[[2301,"김민수","컴퓨터",3,85],[2302,"이서연","전자",2,92],[2303,"박지훈","컴퓨터",4,78],[2304,"최유나","경영",3,95],[2305,"정하늘","전자",3,67],[2306,"한도윤","컴퓨터",2,89]]}],"body":"SELECT COUNT(*) FROM 학생 WHERE 점수 >= 80 AND 학년 = 3;","blanks":[{"a":["2"]}],"expl":"점수 80 이상: 김민수(3학년), 이서연(2), 최유나(3), 한도윤(2). 이 중 3학년은 김민수, 최유나 → 2."},{"id":131,"src":"extra","type":"blank","lang":"SQL","ch":8,"title":"SQL 결과: GROUP BY","ask":"다음 SQL문을 실행했을 때 물음에 답하시오.","tables":[{"name":"[학생]","cols":["학번","이름","학과","학년","점수"],"rows":[[2301,"김민수","컴퓨터",3,85],[2302,"이서연","전자",2,92],[2303,"박지훈","컴퓨터",4,78],[2304,"최유나","경영",3,95],[2305,"정하늘","전자",3,67],[2306,"한도윤","컴퓨터",2,89]]}],"body":"SELECT 학과, AVG(점수) FROM 학생 GROUP BY 학과 HAVING COUNT(*) >= 2;\n\n① 결과 행의 수\n② 컴퓨터 학과의 AVG(점수) 값","blanks":[{"a":["2"]},{"a":["84"]}],"expl":"학과별 인원: 컴퓨터 3, 전자 2, 경영 1 → HAVING으로 경영 제외, 2행. 컴퓨터 평균 = (85+78+89)/3 = 84. 전자는 (92+67)/2 = 79.5."},{"id":132,"src":"extra","type":"blank","lang":"SQL","ch":8,"title":"SQL 결과: 서브쿼리","ask":"다음 SQL문의 실행 결과로 출력되는 행의 수를 쓰시오.","tables":[{"name":"[학생]","cols":["학번","이름","학과","학년","점수"],"rows":[[2301,"김민수","컴퓨터",3,85],[2302,"이서연","전자",2,92],[2303,"박지훈","컴퓨터",4,78],[2304,"최유나","경영",3,95],[2305,"정하늘","전자",3,67],[2306,"한도윤","컴퓨터",2,89]]}],"body":"SELECT 이름 FROM 학생\nWHERE 점수 > (SELECT AVG(점수) FROM 학생);","blanks":[{"a":["4"]}],"expl":"전체 평균 = (85+92+78+95+67+89)/6 = 506/6 ≈ 84.33. 이보다 큰 사람: 김민수 85, 이서연 92, 최유나 95, 한도윤 89 → 4명."},{"id":133,"src":"extra","type":"blank","lang":"SQL","ch":8,"title":"SQL 결과: JOIN","ask":"다음 SQL문의 실행 결과를 쓰시오.","tables":[{"name":"[학생]","cols":["학번","이름","학과","학년","점수"],"rows":[[2301,"김민수","컴퓨터",3,85],[2302,"이서연","전자",2,92],[2303,"박지훈","컴퓨터",4,78],[2304,"최유나","경영",3,95],[2305,"정하늘","전자",3,67],[2306,"한도윤","컴퓨터",2,89]]},{"name":"[학과]","cols":["학과","건물"],"rows":[["컴퓨터","A동"],["전자","B동"],["화학","C동"]]}],"body":"① SELECT COUNT(*) FROM 학생 S JOIN 학과 D ON S.학과 = D.학과;\n② SELECT COUNT(*) FROM 학과 D LEFT OUTER JOIN 학생 S ON D.학과 = S.학과;","blanks":[{"a":["5"]},{"a":["6"]}],"expl":"① 내부 조인: 양쪽에 모두 있는 학과만 → 컴퓨터 3 + 전자 2 = 5 (경영은 [학과]에 없어서 빠짐). ② 왼쪽 외부 조인: [학과]의 모든 행 유지 → 컴퓨터 3 + 전자 2 + 화학 1(학생 쪽 NULL) = 6."},{"id":134,"src":"extra","type":"sql","lang":"SQL","ch":8,"title":"ALTER TABLE","ask":"[학생] 테이블에 가변 길이 문자 15자리의 '전화번호' 속성을 추가하는 SQL문을 작성하시오.","model":"ALTER TABLE 학생 ADD 전화번호 VARCHAR(15);","accept":["ALTER TABLE 학생 ADD COLUMN 전화번호 VARCHAR(15)"],"expl":"ALTER TABLE 테이블명 ADD 속성명 데이터타입; 속성 변경은 ALTER, 삭제는 DROP."},{"id":135,"src":"extra","type":"sql","lang":"SQL","ch":8,"title":"UPDATE","ask":"[학생] 테이블에서 학번이 2305인 학생의 점수를 70으로 수정하는 SQL문을 작성하시오.","tables":[{"name":"[학생]","cols":["학번","이름","학과","학년","점수"],"rows":[[2301,"김민수","컴퓨터",3,85],[2302,"이서연","전자",2,92],[2303,"박지훈","컴퓨터",4,78],[2304,"최유나","경영",3,95],[2305,"정하늘","전자",3,67],[2306,"한도윤","컴퓨터",2,89]]}],"model":"UPDATE 학생 SET 점수 = 70 WHERE 학번 = 2305;","accept":[],"expl":"UPDATE 테이블 SET 속성 = 값 WHERE 조건; WHERE를 빼먹으면 모든 행이 바뀐다."},{"id":136,"src":"extra","type":"sql","lang":"SQL","ch":8,"title":"INSERT","ask":"[학생] 테이블에 학번 2307, 이름 '윤소희', 학과 '경영', 학년 1, 점수 90인 학생을 삽입하는 SQL문을 작성하시오.","tables":[{"name":"[학생]","cols":["학번","이름","학과","학년","점수"],"rows":[[2301,"김민수","컴퓨터",3,85],[2302,"이서연","전자",2,92],[2303,"박지훈","컴퓨터",4,78],[2304,"최유나","경영",3,95],[2305,"정하늘","전자",3,67],[2306,"한도윤","컴퓨터",2,89]]}],"model":"INSERT INTO 학생 VALUES (2307, '윤소희', '경영', 1, 90);","accept":["INSERT INTO 학생(학번, 이름, 학과, 학년, 점수) VALUES (2307, '윤소희', '경영', 1, 90)"],"expl":"모든 속성에 값을 넣을 때는 속성명을 생략할 수 있다. INSERT INTO 테이블 [(속성들)] VALUES (값들);"},{"id":137,"src":"extra","type":"sql","lang":"SQL","ch":8,"title":"CREATE VIEW","ask":"[학생] 테이블에서 학과가 '전자'인 학생의 학번과 이름으로 구성된 뷰 '전자학생'을 생성하는 SQL문을 작성하시오.","tables":[{"name":"[학생]","cols":["학번","이름","학과","학년","점수"],"rows":[[2301,"김민수","컴퓨터",3,85],[2302,"이서연","전자",2,92],[2303,"박지훈","컴퓨터",4,78],[2304,"최유나","경영",3,95],[2305,"정하늘","전자",3,67],[2306,"한도윤","컴퓨터",2,89]]}],"model":"CREATE VIEW 전자학생 AS SELECT 학번, 이름 FROM 학생 WHERE 학과 = '전자';","accept":["CREATE VIEW 전자학생(학번, 이름) AS SELECT 학번, 이름 FROM 학생 WHERE 학과 = '전자'"],"expl":"CREATE VIEW 뷰이름 [(속성들)] AS SELECT문; 뷰는 ALTER로 수정할 수 없어서 삭제 후 다시 만든다."},{"id":138,"src":"extra","type":"blank","lang":"SQL","ch":8,"title":"GRANT · REVOKE","ask":"빈칸에 들어갈 알맞은 SQL 키워드를 쓰시오.","body":"사용자 KIM에게 [학생] 테이블의 SELECT 권한을 부여하고, KIM이 그 권한을 다른 사용자에게 다시 부여할 수 있게 한다.\n( ① ) SELECT ON 학생 TO KIM ( ② );\n\nKIM의 SELECT 권한을 취소하면서, KIM이 다른 사용자에게 부여한 권한까지 연쇄적으로 취소한다.\nREVOKE SELECT ON 학생 FROM KIM ( ③ );","blanks":[{"a":["GRANT"]},{"a":["WITH GRANT OPTION"]},{"a":["CASCADE"]}],"expl":"DCL: GRANT(권한 부여), REVOKE(권한 취소). WITH GRANT OPTION은 재부여 권한, CASCADE는 연쇄 취소. REVOKE에서 \"권한을 부여할 수 있는 권한만\" 취소할 때는 GRANT OPTION FOR를 쓴다."},{"id":139,"src":"extra","type":"blank","lang":"SQL","ch":8,"title":"LIKE · BETWEEN","ask":"빈칸에 들어갈 알맞은 SQL 연산자를 쓰시오.","body":"① 이름이 '김'으로 시작하는 학생 검색\nSELECT * FROM 학생 WHERE 이름 ( ① ) '김%';\n\n② 점수가 80 이상 90 이하인 학생 검색\nSELECT * FROM 학생 WHERE 점수 ( ② ) 80 AND 90;","blanks":[{"a":["LIKE"]},{"a":["BETWEEN"]}],"expl":"LIKE의 %는 0개 이상의 문자, _는 한 문자. BETWEEN A AND B는 A 이상 B 이하(양 끝 포함)."},{"id":140,"src":"extra","type":"blank","lang":"SQL","ch":8,"title":"TRUNCATE","ask":"다음 설명에 해당하는 SQL 명령어를 쓰시오.","body":"테이블의 구조는 남겨 두고 테이블 내의 모든 데이터를 삭제하는 DDL 명령어이다. DELETE와 달리 롤백(ROLLBACK)으로 되돌릴 수 없다.","blanks":[{"a":["TRUNCATE","TRUNCATE TABLE"]}],"expl":"DROP: 테이블 자체 삭제(DDL). TRUNCATE: 구조 유지, 데이터 전부 삭제(DDL). DELETE: 조건에 맞는 행 삭제(DML, 롤백 가능)."},{"id":141,"src":"extra","type":"blank","lang":"SQL","ch":8,"title":"트리거","ask":"다음 설명에 해당하는 절차형 SQL을 쓰시오.","body":"데이터베이스 시스템에서 데이터의 삽입(INSERT), 갱신(UPDATE), 삭제(DELETE) 등의 이벤트가 발생할 때마다 관련 작업이 자동으로 수행되는 절차형 SQL이다.","blanks":[{"a":["트리거","Trigger"]}],"expl":"절차형 SQL: 프로시저(호출해서 실행), 트리거(이벤트 발생 시 자동 실행), 사용자 정의 함수(반드시 값을 반환)."},{"id":142,"src":"extra","type":"blank","lang":"이론","ch":9,"title":"보안 3요소","ask":"다음 설명에 해당하는 보안 요소를 쓰시오.","body":"① 시스템 내의 정보와 자원은 인가된 사용자에게만 접근이 허용되며, 정보가 전송 중에 노출되더라도 데이터를 읽을 수 없다.\n② 시스템 내의 정보는 오직 인가된 사용자만 수정할 수 있다.\n③ 인가받은 사용자는 시스템 내의 정보와 자원을 언제라도 사용할 수 있다.","blanks":[{"a":["기밀성","Confidentiality"]},{"a":["무결성","Integrity"]},{"a":["가용성","Availability"]}],"expl":"보안 3요소(CIA): 기밀성, 무결성, 가용성. 여기에 인증, 부인 방지를 더하기도 한다."},{"id":143,"src":"extra","type":"blank","lang":"이론","ch":9,"title":"입력 데이터 검증 취약점","ask":"다음 설명에 해당하는 공격(보안 약점)을 영문 약어 또는 이름으로 쓰시오.","body":"① 웹 응용 프로그램에 SQL을 삽입하여 내부 데이터베이스 서버의 데이터를 유출 및 변조하고, 관리자 인증을 우회한다.\n② 웹페이지에 악의적인 스크립트를 삽입하여 방문자들의 정보를 탈취하거나 비정상적인 기능 수행을 유발한다.\n③ 사용자가 자신의 의지와는 무관하게 공격자가 의도한 행위(수정, 삭제, 등록 등)를 특정 웹사이트에 요청하게 만든다.","blanks":[{"a":["SQL 삽입","SQL Injection","SQL 인젝션"]},{"a":["XSS","크로스 사이트 스크립팅","Cross Site Scripting"]},{"a":["CSRF","사이트 간 요청 위조","Cross Site Request Forgery","XSRF"]}],"expl":"XSS는 \"스크립트 삽입 → 방문자 피해\", CSRF는 \"사용자 권한으로 원치 않는 요청을 보내게 함\"."},{"id":144,"src":"extra","type":"blank","lang":"이론","ch":9,"title":"암호 알고리즘","ask":"다음 설명에 해당하는 암호 알고리즘을 쓰시오.","body":"① 1978년 MIT의 라이베스트, 샤미르, 애들먼이 제안한 공개키 암호 알고리즘으로, 큰 숫자를 소인수분해하기 어렵다는 것에 기반한다.\n② 2001년 미국 표준 기술 연구소(NIST)가 DES의 한계를 느끼고 발표한 대칭키 알고리즘으로, 블록 크기는 128비트이며 키 길이에 따라 128, 192, 256비트로 분류한다.","blanks":[{"a":["RSA"]},{"a":["AES"]}],"expl":"대칭키(개인키): DES, AES, SEED, ARIA, IDEA, RC4. 비대칭키(공개키): RSA, ECC, ElGamal, Diffie-Hellman."},{"id":145,"src":"extra","type":"blank","lang":"이론","ch":9,"title":"해시와 솔트","ask":"빈칸에 들어갈 알맞은 용어를 쓰시오.","body":"임의의 길이의 입력 데이터를 받아 고정된 길이의 값으로 변환하는 일방향 함수를 ( ① )라 한다.\n같은 비밀번호라도 저장된 값이 서로 다르도록 비밀번호에 덧붙이는 무작위 문자열을 ( ② )라 한다.","blanks":[{"a":["해시","해시 함수","Hash","Hash Function"]},{"a":["솔트","Salt"]}],"expl":"해시 알고리즘: SHA 시리즈, MD5, N-NASH, SNEFRU 등. 솔트를 쓰면 레인보우 테이블 공격을 막을 수 있다."},{"id":146,"src":"extra","type":"blank","lang":"이론","ch":9,"title":"세션 하이재킹","ask":"다음 설명에 해당하는 공격 기법을 쓰시오.","body":"상호 인증 과정을 거친 후 접속해 있는 서버와 클라이언트 사이의 세션 정보를 가로채는 공격 기법이다. 정상적인 연결을 RST 패킷으로 끊고 공격자가 그 세션을 이어받아 인증 없이 서버에 접근한다.","blanks":[{"a":["세션 하이재킹","세션하이재킹","Session Hijacking"]}],"expl":"2025년 3회 실기에 나왔다는 복원 후기가 있는 주제. 비슷한 공격: 스니핑(패킷 엿보기), 스푸핑(위장)."},{"id":147,"src":"extra","type":"blank","lang":"이론","ch":9,"title":"스미싱과 피싱","ask":"다음 설명에 해당하는 공격 기법을 쓰시오.","body":"① 문자 메시지(SMS)를 이용하여 사용자의 개인 신용 정보를 빼내거나 악성 앱을 설치하게 만드는 수법\n② 소셜 네트워크에서 악성 링크를 클릭하게 하거나, 금융기관 등을 사칭한 이메일을 보내 개인정보를 빼내는 수법","blanks":[{"a":["스미싱","Smishing"]},{"a":["피싱","Phishing"]}],"expl":"스미싱 = SMS + 피싱. 특정 대상을 노린 피싱은 스피어 피싱(Spear Phishing)."},{"id":148,"src":"extra","type":"blank","lang":"이론","ch":9,"title":"DoS 공격 유형","ask":"다음 설명에 해당하는 서비스 거부(DoS) 공격 유형을 쓰시오.","body":"① 패킷을 전송할 때 송신 IP 주소와 수신 IP 주소를 모두 공격 대상의 IP 주소로 하여 공격 대상에게 전송한다. 공격 대상은 자신에게 응답을 계속 보내게 된다.\n② 출발지 주소를 공격 대상의 IP로 설정하여 네트워크 전체에 ICMP Echo 패킷을 직접 브로드캐스팅하여 마비시킨다.\n③ TCP 3-way-handshake 과정에서 공격자가 SYN 패킷만 대량으로 보내 서버가 대기 상태에 놓이게 만든다.","blanks":[{"a":["LAND Attack","LAND","랜드 어택","LAND 공격"]},{"a":["스머핑","Smurfing","Smurf","스머프"]},{"a":["SYN Flooding","SYN 플러딩","SYN Flood"]}],"expl":"이 밖에 Ping of Death(큰 ICMP 패킷), TearDrop(Offset 조작), Ping Flood 등이 있다."},{"id":149,"src":"extra","type":"blank","lang":"이론","ch":9,"title":"접근 통제","ask":"다음 설명에 해당하는 접근 통제 기법을 영문 약어로 쓰시오.","body":"① 데이터에 접근하는 사용자의 신원에 따라 접근 권한을 부여하며, 데이터 소유자가 접근 통제 권한을 지정한다.\n② 주체와 객체의 등급을 비교하여 접근 권한을 부여하며, 시스템이 접근 통제 권한을 지정한다.\n③ 사용자의 역할에 따라 접근 권한을 부여하며, 중앙 관리자가 접근 통제 권한을 지정한다.","blanks":[{"a":["DAC","임의 접근 통제","Discretionary Access Control"]},{"a":["MAC","강제 접근 통제","Mandatory Access Control"]},{"a":["RBAC","역할 기반 접근 통제","Role Based Access Control"]}],"expl":"DAC = 신원·소유자, MAC = 등급·시스템, RBAC = 역할·중앙 관리자."},{"id":150,"src":"extra","type":"blank","lang":"이론","ch":9,"title":"AAA","ask":"다음 설명에 해당하는 AAA 서버의 기능을 쓰시오.","body":"① 시스템에 접근하는 사용자의 신원을 검증하는 것\n② 신원이 검증된 사용자에게 특정 권한과 서비스를 허용하는 것\n③ 사용자가 어떤 종류의 서비스를 이용했고, 얼마만큼의 리소스를 사용했는지 그 정보를 수집하는 것","blanks":[{"a":["인증","Authentication"]},{"a":["인가","권한 부여","Authorization"]},{"a":["계정 관리","계정관리","Accounting","어카운팅","과금"]}],"expl":"AAA = Authentication(인증), Authorization(인가), Accounting(계정 관리)."},{"id":151,"src":"extra","type":"blank","lang":"이론","ch":9,"title":"APT와 랜섬웨어","ask":"다음 설명에 해당하는 공격을 쓰시오.","body":"① 조직적으로 특정 기업이나 조직 네트워크에 침투해 활동 거점을 마련한 뒤, 때를 기다리면서 보안을 무력화시키고 정보를 수집한 다음 외부로 빼돌리는 지속적·지능적 공격\n② 인터넷 사용자의 컴퓨터에 잠입해 내부 문서나 파일 등을 암호화해 사용자가 열지 못하게 하고, 암호 해독용 프로그램의 전달을 조건으로 금품을 요구하는 악성 프로그램","blanks":[{"a":["APT","지능형 지속 위협","Advanced Persistent Threats","Advanced Persistent Threat"]},{"a":["랜섬웨어","Ransomware"]}],"expl":"APT 공격 방법: 내부자에게 악성 코드 메일 발송, 정상 사이트 감염(워터링 홀), 이동식 저장장치 감염 등."},{"id":152,"src":"extra","type":"blank","lang":"이론","ch":9,"title":"Secure SDLC","ask":"다음 설명에 해당하는 용어를 쓰시오.","body":"보안상 안전한 소프트웨어를 개발하기 위해 소프트웨어 개발 생명주기(SDLC)의 각 단계에 보안 강화 활동을 추가한 것이다. 대표적인 방법론으로 CLASP, SDL, Seven Touchpoints가 있다.","blanks":[{"a":["Secure SDLC","SecureSDLC","시큐어 SDLC"]}],"expl":"SDL은 마이크로소프트가 만든 방법론, Seven Touchpoints는 실무적으로 검증된 7가지 보안 모범사례를 통합한 방법론, CLASP는 운용 중인 시스템에 적용하기 좋은 방법론."},{"id":153,"src":"extra","type":"blank","lang":"이론","ch":11,"title":"OSI 7계층","ask":"다음 설명에 해당하는 OSI 참조 모델의 계층을 쓰시오.","body":"① 두 개의 인접한 개방 시스템들 간에 신뢰성 있고 효율적인 정보 전송을 할 수 있도록 하며, 흐름 제어, 프레임 동기화, 오류 제어 등을 수행한다.\n② 개방 시스템들 간의 네트워크 연결을 관리하며, 경로 설정(Routing), 트래픽 제어, 패킷 정보 전송을 수행한다.\n③ 종단 시스템(End-to-End) 간에 투명한 데이터 전송을 가능하게 하며, TCP와 UDP가 이 계층의 프로토콜이다.","blanks":[{"a":["데이터 링크 계층","데이터 링크","데이터링크","Data Link","Data Link Layer"]},{"a":["네트워크 계층","네트워크","Network","Network Layer"]},{"a":["전송 계층","전송","Transport","Transport Layer"]}],"expl":"아래부터: 물리 → 데이터 링크(프레임, MAC) → 네트워크(패킷, IP, 라우터) → 전송(세그먼트, TCP/UDP) → 세션 → 표현 → 응용."},{"id":154,"src":"extra","type":"blank","lang":"이론","ch":11,"title":"페이지 교체 계산","ask":"페이지 프레임이 3개이고 처음에는 모두 비어 있을 때, 다음 참조 순서에 대해 각 알고리즘의 페이지 부재(Page Fault) 횟수를 구하시오.","body":"참조 페이지 순서: 7, 0, 1, 2, 0, 3, 0, 4\n\n① FIFO\n② LRU","blanks":[{"a":["7","7회","7번"]},{"a":["6","6회","6번"]}],"expl":"FIFO: 7 0 1(부재 3) → 2(7 교체) → 0 적중 → 3(0 교체) → 0(1 교체) → 4(2 교체) = 7회.\nLRU: 7 0 1(3) → 2(가장 오래 안 쓴 7 교체) → 0 적중 → 3(1 교체) → 0 적중 → 4(2 교체) = 6회."},{"id":155,"src":"extra","type":"blank","lang":"이론","ch":11,"title":"스케줄링 계산","ask":"다음 프로세스들이 모두 0초에 도착했을 때, 각 기법의 평균 대기 시간을 구하시오.","tables":[{"name":"","cols":["프로세스","실행 시간"],"rows":[["P1",6],["P2",8],["P3",7],["P4",3]]}],"body":"① FCFS (P1 → P2 → P3 → P4 순서)\n② SJF","blanks":[{"a":["10.25"]},{"a":["7"]}],"expl":"FCFS 대기: P1 0, P2 6, P3 14, P4 21 → 41/4 = 10.25.\nSJF(짧은 것부터 P4 → P1 → P3 → P2) 대기: P4 0, P1 3, P3 9, P2 16 → 28/4 = 7."},{"id":156,"src":"extra","type":"blank","lang":"이론","ch":11,"title":"HRN 스케줄링","ask":"HRN 스케줄링에서 다음 작업 중 가장 먼저 실행되는 작업을 쓰시오.","tables":[{"name":"","cols":["작업","대기 시간","서비스(실행) 시간"],"rows":[["A",5,5],["B",10,20],["C",12,4]]}],"blanks":[{"a":["C"]}],"expl":"HRN 우선순위 = (대기 시간 + 서비스 시간) / 서비스 시간. A = 10/5 = 2, B = 30/20 = 1.5, C = 16/4 = 4 → 값이 가장 큰 C가 먼저."},{"id":157,"src":"extra","type":"blank","lang":"이론","ch":11,"title":"서브넷 계산","ask":"192.168.1.0/24 네트워크를 FLSM 방식으로 4개의 서브넷으로 나누었다. 물음에 답하시오.","body":"① 서브넷 마스크 (10진수 점 표기)\n② 각 서브넷에서 호스트에 할당 가능한 IP 주소 수\n③ 세 번째 서브넷의 브로드캐스트 주소","blanks":[{"a":["255.255.255.192"]},{"a":["62","62개"]},{"a":["192.168.1.191"]}],"expl":"4개로 나누려면 호스트 비트 중 2비트를 빌림 → /26 → 255.255.255.192. 서브넷당 2⁶ = 64개 주소 중 네트워크·브로드캐스트 주소 2개 제외 → 62개. 세 번째 서브넷은 192.168.1.128 ~ .191 → 브로드캐스트 192.168.1.191."},{"id":158,"src":"extra","type":"blank","lang":"이론","ch":11,"title":"IPv6","ask":"빈칸에 들어갈 알맞은 숫자를 쓰시오.","body":"IPv6 주소는 ( ① )비트로 구성되며, 16비트씩 ( ② )개 부분으로 나누어 콜론(:)으로 구분한다.\nIPv4 주소는 ( ③ )비트로 구성된다.","blanks":[{"a":["128"]},{"a":["8"]},{"a":["32"]}],"expl":"IPv6: 128비트, 16비트 × 8, 16진수, 유니캐스트/멀티캐스트/애니캐스트. IPv4: 32비트, 8비트 × 4, 10진수, 유니/멀티/브로드캐스트."},{"id":159,"src":"extra","type":"blank","lang":"이론","ch":11,"title":"인터넷 계층 프로토콜","ask":"다음 설명에 해당하는 프로토콜을 쓰시오.","body":"① 호스트의 IP 주소를 호스트와 연결된 네트워크 접속 장치의 물리적 주소(MAC Address)로 바꾼다.\n② ①과 반대로 물리적 주소를 IP 주소로 변환한다.\n③ IP와 조합하여 통신 중에 발생하는 오류의 처리와 전송 경로 변경 등을 위한 제어 메시지를 관리한다.","blanks":[{"a":["ARP"]},{"a":["RARP"]},{"a":["ICMP"]}],"expl":"인터넷 계층 프로토콜: IP, ICMP, IGMP, ARP, RARP. ping 명령은 ICMP를 사용한다."},{"id":160,"src":"extra","type":"blank","lang":"이론","ch":11,"title":"라우팅 프로토콜","ask":"다음 설명에 해당하는 라우팅 프로토콜을 쓰시오.","body":"① 거리 벡터 라우팅 프로토콜로, 최단 경로 탐색에 Bellman-Ford 알고리즘을 사용하며 최대 홉(Hop) 수를 15로 제한한다.\n② 링크 상태 라우팅 프로토콜로, 다익스트라 알고리즘을 이용하며 대규모 네트워크에 많이 사용된다.\n③ 자율 시스템(AS) 간의 라우팅 프로토콜로, EGP의 단점을 보완하기 위해 만들어졌다.","blanks":[{"a":["RIP"]},{"a":["OSPF"]},{"a":["BGP"]}],"expl":"IGP(AS 내부): RIP, OSPF. EGP(AS 간): BGP."},{"id":161,"src":"extra","type":"blank","lang":"이론","ch":11,"title":"스토리지","ask":"다음 설명에 해당하는 스토리지 방식을 영문 약어로 쓰시오.","body":"① 하드디스크와 같은 데이터 저장장치를 호스트 버스 어댑터에 직접 연결하는 방식\n② 서버와 저장장치를 네트워크를 통해 연결하는 방식으로, 별도의 파일 관리 기능이 있는 NAS Storage가 내장된 저장장치를 직접 관리한다.\n③ 서버와 저장장치를 연결하는 전용 네트워크(광 채널 스위치)를 별도로 구성하는 방식","blanks":[{"a":["DAS","Direct Attached Storage"]},{"a":["NAS","Network Attached Storage"]},{"a":["SAN","Storage Area Network"]}],"expl":"DAS(직접 연결), NAS(네트워크 연결, 파일 서버), SAN(전용 네트워크, 광 채널)."},{"id":162,"src":"extra","type":"blank","lang":"이론","ch":11,"title":"RAID","ask":"다음 설명에 해당하는 RAID 레벨을 쓰시오.","body":"① 패리티 없이 데이터를 여러 디스크에 분산 저장(스트라이핑)하는 방식으로, 속도는 빠르지만 장애 복구가 불가능하다.\n② 같은 데이터를 다른 디스크에 중복 저장(미러링)하는 방식\n③ 패리티 정보를 별도 디스크가 아닌 모든 디스크에 분산 저장하는 방식","blanks":[{"a":["RAID 0","RAID0","0"]},{"a":["RAID 1","RAID1","1"]},{"a":["RAID 5","RAID5","5"]}],"expl":"RAID 0(스트라이핑), 1(미러링), 3·4(전용 패리티 디스크), 5(분산 패리티), 6(패리티 2개)."},{"id":163,"src":"extra","type":"blank","lang":"이론","ch":11,"title":"메모리 배치 전략","ask":"다음과 같이 빈 기억 공간이 있을 때, 14K 크기의 프로그램을 최적 적합(Best Fit) 방법으로 배치하려 한다. 물음에 답하시오.","body":"빈 공간(순서대로): 10K, 30K, 20K, 15K\n\n① 프로그램이 배치되는 빈 공간의 크기\n② 이때 발생하는 내부 단편화의 크기","blanks":[{"a":["15K","15"]},{"a":["1K","1"]}],"expl":"최적 적합: 들어갈 수 있는 공간 중 단편화가 가장 작은 곳 → 15K (단편화 1K). 최초 적합이라면 앞에서부터 처음 들어가는 30K, 최악 적합이라면 가장 큰 30K."},{"id":164,"src":"extra","type":"blank","lang":"이론","ch":11,"title":"교착상태","ask":"빈칸에 들어갈 알맞은 용어를 쓰시오.","body":"교착상태 발생의 필요 충분 조건: 상호 배제, 점유와 대기, ( ① ), 환형 대기\n은행원 알고리즘(Banker's Algorithm)은 교착상태 해결 방법 중 ( ② ) 기법에 해당한다.","blanks":[{"a":["비선점","Non-preemption","No Preemption"]},{"a":["회피","Avoidance"]}],"expl":"해결 방법: 예방(Prevention, 조건 제거), 회피(Avoidance, 은행원 알고리즘), 발견(Detection), 회복(Recovery)."},{"id":165,"src":"extra","type":"blank","lang":"이론","ch":11,"title":"리눅스 권한","ask":"다음 물음에 답하시오.","body":"① 리눅스에서 파일의 접근 권한(퍼미션)을 변경하는 명령어\n② 권한 rwxr-x--x를 8진수 숫자로 표현한 값","blanks":[{"a":["chmod"]},{"a":["751"]}],"expl":"r=4, w=2, x=1. 소유자 rwx = 7, 그룹 r-x = 5, 기타 --x = 1 → 751. 예: chmod 751 file. 소유자 변경은 chown."},{"id":166,"src":"extra","type":"blank","lang":"이론","ch":11,"title":"블록체인과 SDN","ask":"다음 설명에 해당하는 기술을 쓰시오.","body":"① 온라인 금융 거래 정보를 온라인 네트워크 참여자(Peer)의 디지털 장비에 분산 저장하는 기술로, 거래 정보를 블록 단위로 체인처럼 연결해 위·변조를 어렵게 한다.\n② 네트워크를 컴퓨터처럼 모델링하여 여러 사용자가 각각의 소프트웨어로 네트워킹을 가상화하여 제어하고 관리하는 네트워크","blanks":[{"a":["블록체인","Blockchain"]},{"a":["SDN","소프트웨어 정의 네트워킹","소프트웨어 정의 네트워크","Software Defined Networking"]}],"expl":"비슷하게 SDS(Software Defined Storage)는 저장소를 소프트웨어로 가상화해 관리하는 기술."},{"id":167,"src":"extra","type":"blank","lang":"이론","ch":11,"title":"애드 혹 네트워크","ask":"다음 설명에 해당하는 네트워크를 쓰시오.","body":"재난 현장과 같이 별도의 고정된 유선망을 구축할 수 없는 장소에서 모바일 호스트(Mobile Host)만을 이용하여 구성한 네트워크이다. 망을 구성한 후 단기간 사용되는 경우나 유선망을 구성하기 어려운 경우에 적합하다.","blanks":[{"a":["애드 혹 네트워크","애드혹 네트워크","애드혹","Ad-hoc Network","Ad hoc Network","Adhoc"]}],"expl":"메시 네트워크(Mesh Network)는 대규모 디바이스 연결에 특화된 네트워크로, 애드 혹과 구분해 둘 것."},{"id":168,"src":"extra","type":"blank","lang":"이론","ch":12,"title":"DRM 구성 요소","ask":"다음 설명에 해당하는 DRM 구성 요소를 쓰시오.","body":"① 콘텐츠를 메타 데이터와 함께 배포 가능한 형태로 묶어 암호화하는 프로그램\n② 저작권에 대한 사용 권한, 라이선스 발급, 암호화된 키 관리, 사용량에 따른 결제 관리 등을 수행하는 곳","blanks":[{"a":["패키저","Packager"]},{"a":["클리어링 하우스","클리어링하우스","Clearing House"]}],"expl":"DRM 구성: 클리어링 하우스, 콘텐츠 제공자, 패키저, 콘텐츠 분배자, 콘텐츠 소비자, DRM 컨트롤러, 보안 컨테이너."},{"id":169,"src":"extra","type":"blank","lang":"이론","ch":12,"title":"빌드 자동화 도구","ask":"다음 설명에 해당하는 빌드 자동화 도구를 쓰시오.","body":"① Groovy를 기반으로 한 오픈 소스 형태의 빌드 자동화 도구로, 안드로이드 앱 개발 환경에서 사용된다.\n② Java 기반의 오픈 소스 형태로, 가장 많이 사용되는 빌드 자동화 도구이며 서블릿 컨테이너에서 실행되는 서버 기반 도구이다.","blanks":[{"a":["Gradle","그래들"]},{"a":["Jenkins","젠킨스"]}],"expl":"Gradle은 실행할 처리 명령을 모아 태스크로 만든 후 태스크 단위로 실행한다. Jenkins는 SVN, Git 등 대부분의 형상 관리 도구와 연동된다."},{"id":170,"src":"extra","type":"blank","lang":"이론","ch":12,"title":"릴리즈 노트","ask":"다음 설명에 해당하는 문서를 쓰시오.","body":"개발 과정에서 정리된 제품의 릴리즈 정보를 고객과 공유하기 위한 문서로, 테스트 진행 방법, 기능 개선·버그 수정·변경 사항, 사용 환경 등을 포함한다. 소프트웨어의 최초 및 변경, 개선 사항을 정리하여 배포할 때 함께 제공한다.","blanks":[{"a":["릴리즈 노트","릴리스 노트","Release Note","Release Notes"]}],"expl":"릴리즈 노트 구성: 헤더, 개요, 목적, 문제 요약, 재현 항목, 수정/개선 내용, 사용자 영향도, SW 지원 영향도, 노트, 면책 조항, 연락처."},{"id":171,"src":"extra","type":"blank","lang":"이론","ch":12,"title":"버전 관리 용어","ask":"다음 설명에 해당하는 버전 관리 용어를 영문으로 쓰시오.","body":"① 버전 관리를 하고 있지 않은, 아무것도 없는 저장소(Repository)에 처음으로 파일을 복사한다.\n② 프로그램을 수정하기 위해 저장소에서 파일을 받아온다.\n③ 체크인을 수행할 때 이전에 갱신된 내용이 있는 경우 충돌(Conflict)을 알리고 diff 도구를 이용해 수정한 후 갱신을 완료한다.","blanks":[{"a":["Import","임포트"]},{"a":["Check-Out","Checkout","체크아웃"]},{"a":["Commit","커밋"]}],"expl":"Import → Check-Out → (수정) → Check-In → Commit. Update는 저장소의 최신 버전을 작업 공간에 반영, Diff는 버전 간 차이 비교."},{"id":172,"src":"extra","type":"blank","lang":"이론","ch":12,"title":"DRM 기술 요소","ask":"다음 설명에 해당하는 DRM 기술 요소를 쓰시오.","body":"① 크랙에 의한 콘텐츠 사용 방지 기술 (Secure DB, Secure Time Management 등)\n② 라이선스의 내용을 표현하는 기술 (XrML/MPEG-21 REL, ODRL 등)\n③ 콘텐츠에 대한 식별 체계를 표현하는 기술 (DOI, URI 등)","blanks":[{"a":["크랙 방지","Tamper Resistance"]},{"a":["저작권 표현","Right Expression","Rights Expression"]},{"a":["식별 기술","식별","Identification"]}],"expl":"DRM 기술 요소 8가지: 암호화, 키 관리, 암호화 파일 생성(Packager), 식별 기술, 저작권 표현, 정책 관리, 크랙 방지, 인증. 괄호 속 예시 기술(DOI, XrML 등)이 힌트로 같이 나오는 경우가 많다."},{"id":173,"src":"extra","type":"code","lang":"Java","ch":10,"title":"람다와 예외 처리","code":"public class Main {\n\n    static interface F {\n        int apply(int x) throws Exception;\n    }\n\n    public static int run(F f) {\n        try {\n            return f.apply(3);\n        } catch (Exception e) {\n            return 7;\n        }\n    }\n\n    public static void main(String[] args) {\n\n        F f = (x) -> {\n            if (x > 2) {\n                throw new Exception();\n            }\n            return x * 2;\n        };\n\n        System.out.print(run(f) + run((int n) -> n + 9));\n    }\n}","output":"19","expl":"F는 메소드가 apply 하나뿐인 함수형 인터페이스라서 람다로 구현할 수 있다. run(f): f.apply(3)에서 3 > 2가 참이라 예외가 발생 → catch에서 7 반환. run((int n) -> n + 9): apply(3) = 3 + 9 = 12. print 안의 + 는 int끼리 더하기라서 7 + 12 = 19 (문자열 연결 \"712\"가 아님). 함정: 예외가 나면 try의 return은 실행되지 않고 catch의 return이 실행된다."}]</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const P = JSON.parse(document.getElementById('data').textContent);
const LS = 'jcg-quiz-v1';
const store = (() => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } })();
store.rec = store.rec || {};          // id -> 'correct' | 'wrong'
store.draft = store.draft || {};      // id -> 답안 초안
const F0 = { ch: 'all', lang: 'all', src: 'all', state: 'all' };
store.f = Object.assign({}, F0, store.f || {});
function save() { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} }

const CH = { 1: '요구사항 확인', 2: '데이터 입출력 구현', 3: '통합 구현', 4: '서버 프로그램 구현', 5: '인터페이스 구현', 6: '화면 설계', 7: '애플리케이션 테스트 관리', 8: 'SQL 응용', 9: '소프트웨어 개발 보안 구축', 10: '프로그래밍 언어 활용', 11: '응용 SW 기초 기술 활용', 12: '제품 소프트웨어 패키징' };
const chs = [...new Set(P.map(p => p.ch))].sort((a, b) => a - b);
const FILTERS = {
  ch: [['all', '전체'], ...chs.map(c => [String(c), String(c)])],
  lang: [['all', '전체'], ['C', 'C'], ['Java', 'Java'], ['Python', 'Python'], ['SQL', 'SQL'], ['이론', '이론']],
  src: [['all', '전체'], ['book', '본문·기출체크'], ['bank', '예상문제'], ['extra', '추가문제']],
  state: [['all', '전체'], ['todo', '안 푼 문제'], ['wrong', '틀린 문제']],
};
const LANG_KO = { C: 'C', Java: 'Java', Python: 'Python' };
const NUM = '①②③④⑤⑥⑦⑧⑨⑩';
document.getElementById('brand-sub').textContent = `1~12장 · ${P.length}문항 (10장 코드 ${P.filter(p => p.type === 'code').length} + 추가 ${P.filter(p => p.src === 'extra').length})`;

let cur = typeof store.cur === 'number' && P.some(p => p.id === store.cur) ? store.cur : 1;
let graded = null; // 현재 문제의 채점 결과(화면용)

function visible() {
  const f = store.f;
  return P.filter(p =>
    (f.ch === 'all' || String(p.ch) === f.ch) &&
    (f.lang === 'all' || p.lang === f.lang) &&
    (f.src === 'all' || p.src === f.src) &&
    (f.state === 'all' || (f.state === 'todo' ? !store.rec[p.id] : store.rec[p.id] === 'wrong')));
}

// ---------- 채점 ----------
function norm(s) {
  return s.replace(/\r/g, '').replace(/\t/g, '    ').split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/^\n+|\n+$/g, '');
}
function squash(s) { return s.replace(/\s+/g, ''); }
function tokens(s) { return s.replace(/[{}\[\]',"]/g, ' ').replace(/과일명 :/g, ' ').split(/\s+/).filter(Boolean).sort().join('|'); }
function grade(p, ans) {
  const a = norm(ans);
  const targets = [p.output, p.console].filter(Boolean).map(norm);
  if (targets.includes(a)) return 'exact';
  if (p.unordered && tokens(a) === tokens(p.output)) return 'exact';
  if (targets.some(t => squash(t) === squash(a))) return 'space';
  return 'wrong';
}
// 용어 답안: 대소문자·공백·하이픈·괄호·점 무시
function normTerm(s) { return s.toLowerCase().replace(/[\s\-_.·()'"‘’“”]/g, ''); }
function gradeBlanks(p, answers) {
  const hit = (b, a) => !!a.trim() && b.a.some(x => normTerm(x) === normTerm(a));
  if (!p.anyOrder) return answers.map((a, i) => hit(p.blanks[i], a));
  const used = new Set();
  return answers.map(a => {
    const j = p.blanks.findIndex((b, k) => !used.has(k) && hit(b, a));
    if (j < 0) return false;
    used.add(j); return true;
  });
}
function normSql(s) {
  return s.toUpperCase().replace(/\s+/g, ' ').replace(/\s*([(),=<>;])\s*/g, '$1').replace(/;+$/, '').trim();
}

// ---------- 렌더링 ----------
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderFilters() {
  document.querySelectorAll('[data-filter]').forEach(box => {
    const key = box.dataset.filter;
    box.innerHTML = FILTERS[key].map(([v, l]) => `<button type="button" class="chip" data-v="${v}" aria-pressed="${store.f[key] === v}">${l}</button>`).join('');
    box.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      store.f[key] = b.dataset.v; save();
      const list = visible();
      if (list.length && !list.some(p => p.id === cur)) go(list[0].id); else render();
      renderFilters();
    };
  });
  $('#chname').textContent = store.f.ch === 'all' ? '' : `${store.f.ch}장 ${CH[store.f.ch]}`;
}

function renderSide() {
  const vals = Object.values(store.rec);
  const ok = vals.filter(v => v === 'correct').length, bad = vals.filter(v => v === 'wrong').length;
  $('#s-done').textContent = `${ok + bad}/${P.length}`;
  $('#s-ok').textContent = ok;
  $('#s-bad').textContent = bad;
  $('#bar-g').style.width = (ok / P.length * 100) + '%';
  $('#bar-r').style.width = (bad / P.length * 100) + '%';
  const list = visible();
  $('#map-count').textContent = list.length === P.length ? '' : `· ${list.length}문항`;
  $('#omr').innerHTML = list.map(p => {
    const st = store.rec[p.id] || '';
    return `<button type="button" class="${st} ${p.id === cur ? 'cur' : ''}" data-id="${p.id}" aria-label="문제 ${p.id}${st === 'correct' ? ' 정답' : st === 'wrong' ? ' 오답' : ''}" ${p.id === cur ? 'aria-current="true"' : ''}>${p.id}</button>`;
  }).join('');
}

function highlight(p) {
  const lang = { C: 'c', Java: 'java', Python: 'python' }[p.lang];
  try { if (window.hljs) return hljs.highlight(p.code, { language: lang, ignoreIllegals: true }).value; } catch (e) {}
  return esc(p.code);
}

function markSvg(kind) {
  if (kind === 'exact') return `<svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M44 9 C 28 2, 6 14, 8 34 C 10 54, 40 60, 54 44 C 62 34, 58 16, 40 10"/></svg>`;
  if (kind === 'space') return `<svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><polygon points="32,8 58,54 6,54"/></svg>`;
  return `<svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M50 8 L 14 58"/></svg>`;
}

// 공백 차이가 있는 경우 정답의 공백을 표시
function showSpaces(s) { return esc(s).replace(/ /g, '<span class="sp"> </span>'); }

function render() {
  const list = visible();
  renderSide();
  const sheet = $('#sheet');
  if (!list.length) {
    sheet.innerHTML = `<div class="empty"><h2>${store.f.state === 'wrong' ? '틀린 문제가 없어요' : '조건에 맞는 문제가 없어요'}</h2><p>왼쪽 필터를 바꿔 보세요.</p><button class="btn" type="button" id="clear-f">필터 모두 해제</button></div>`;
    $('#clear-f').onclick = () => { store.f = Object.assign({}, F0); save(); renderFilters(); render(); };
    return;
  }
  const p = P.find(x => x.id === cur);
  const idx = list.findIndex(x => x.id === cur);
  const prev = store.rec[p.id];
  const ask = p.ask || `다음 ${LANG_KO[p.lang]} 프로그램의 실행 결과를 쓰시오.`;
  const srcLabel = p.src === 'bank' ? '예상문제은행 · ' + p.title.replace('예상문제 ', '문제 ')
    : p.src === 'extra' ? `추가문제 · ${p.title}` : p.title.replace(' · ', ' ');

  let stem = '', answerUi = '';
  if (p.type === 'code') {
    const lines = p.code.split('\n').length;
    stem = `${p.input ? `<div class="inputbox"><span>키보드 입력</span><code>${esc(p.input)}</code></div>` : ''}
      <div class="code"><pre class="ln" aria-hidden="true">${Array.from({ length: lines }, (_, i) => i + 1).join('\n')}</pre><pre><code>${highlight(p)}</code></pre></div>`;
    answerUi = `<label for="ans">답안 작성란 <kbd>Ctrl+Enter 채점</kbd></label>
      <textarea id="ans" spellcheck="false" autocomplete="off" placeholder="출력 결과를 그대로 적어 보세요. 줄바꿈도 출력과 똑같이."></textarea>`;
  } else {
    stem = `${p.tables ? `<div class="tables">${p.tables.map(tableHtml).join('')}</div>` : ''}
      ${p.body ? `<div class="qbody${p.lang === 'SQL' ? ' mono' : ''}">${esc(p.body)}</div>` : ''}
      ${p.choices ? `<div class="choices"><b>보기</b><ul>${p.choices.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}`;
    if (p.type === 'sql') {
      answerUi = `<label for="ans">답안 작성란 <kbd>Ctrl+Enter 채점</kbd></label>
        <textarea id="ans" spellcheck="false" autocomplete="off" placeholder="SQL문을 작성하세요."></textarea>`;
    } else {
      const one = p.blanks.length === 1;
      answerUi = `<label>답안 작성란 <kbd>Enter 다음 칸 · 마지막 칸에서 채점</kbd></label>
        <div class="blanks">${p.blanks.map((b, i) => `<div class="brow"><b>${one ? '답' : NUM[i]}</b><input type="text" id="b${i}" data-i="${i}" autocomplete="off" spellcheck="false" aria-label="${one ? '답' : NUM[i] + '번 답'}"></div>`).join('')}</div>`;
    }
  }

  sheet.innerHTML = `
    <div class="qhead">
      <div class="qno">문제 ${p.id}<small>${idx + 1} / ${list.length}</small></div>
      <div class="qsrc">${p.ch}장 ${esc(CH[p.ch])} · ${esc(srcLabel)}</div>
      <div class="tags">
        <span class="tag">${p.lang}</span>
        ${prev ? `<span class="tag prev-${prev}">이전 풀이: ${prev === 'correct' ? '정답' : '오답'}</span>` : ''}
      </div>
    </div>
    <p class="ask">${esc(ask)}</p>
    ${stem}
    <div class="answer">
      ${answerUi}
      <div class="actions">
        <button class="btn primary" type="button" id="check">채점하기</button>
        <button class="btn" type="button" id="reveal">모르겠어요, 정답 보기</button>
      </div>
    </div>
    <div id="result"></div>
    <div class="nav">
      <button class="btn" type="button" id="prev" ${idx <= 0 ? 'disabled' : ''}>← 이전</button>
      <button class="btn" type="button" id="rand">무작위 문제</button>
      <span class="spacer"></span>
      <button class="btn" type="button" id="next" ${idx >= list.length - 1 ? 'disabled' : ''}>다음 문제 →</button>
    </div>`;

  if (p.type === 'blank') {
    const d = Array.isArray(store.draft[p.id]) ? store.draft[p.id] : [];
    const inputs = [...document.querySelectorAll('.brow input')];
    inputs.forEach((inp, i) => {
      inp.value = d[i] || '';
      inp.oninput = () => { store.draft[p.id] = inputs.map(x => x.value); save(); };
      inp.onkeydown = e => {
        if (e.key !== 'Enter' || e.isComposing) return;
        e.preventDefault();
        if (i < inputs.length - 1 && !(e.ctrlKey || e.metaKey)) inputs[i + 1].focus(); else check();
      };
    });
  } else {
    const ta = $('#ans');
    ta.value = typeof store.draft[p.id] === 'string' ? store.draft[p.id] : '';
    ta.oninput = () => { store.draft[p.id] = ta.value; save(); };
    ta.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); check(); } };
  }
  $('#check').onclick = check;
  $('#reveal').onclick = () => showResult(null);
  $('#prev').onclick = () => go(list[idx - 1].id);
  $('#next').onclick = () => go(list[idx + 1].id);
  $('#rand').onclick = () => {
    const pool = list.filter(x => x.id !== cur && !store.rec[x.id]);
    const from = pool.length ? pool : list.filter(x => x.id !== cur);
    if (from.length) go(from[Math.floor(Math.random() * from.length)].id);
  };
  if (graded && graded.id === p.id) showResult(graded.kind, true);
}

function tableHtml(t) {
  return `<div class="tbox">${t.name ? `<b>${esc(t.name)}</b>` : ''}<table class="dtable"><thead><tr>${t.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r => `<tr>${r.map(v => `<td>${esc(String(v))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function blankAnswers() { return [...document.querySelectorAll('.brow input')].map(x => x.value); }

function check() {
  const p = P.find(x => x.id === cur);
  if (p.type === 'blank') {
    const ans = blankAnswers();
    if (ans.every(a => !a.trim())) { const f = $('#b0'); f.focus(); f.placeholder = '답을 먼저 적어 주세요. 모르면 "정답 보기"를 누르세요.'; return; }
    const ok = gradeBlanks(p, ans), n = ok.filter(Boolean).length;
    const kind = n === ok.length ? 'exact' : n ? 'partial' : 'wrong';
    record(p.id, kind === 'exact' ? 'correct' : 'wrong');
    showResult(kind);
    return;
  }
  const ans = $('#ans').value;
  if (!ans.trim()) { $('#ans').focus(); $('#ans').placeholder = '답을 먼저 적어 주세요. 모르면 "정답 보기"를 누르세요.'; return; }
  if (p.type === 'sql') {
    const a = normSql(ans);
    if ([p.model, ...(p.accept || [])].some(x => normSql(x) === a)) { record(p.id, 'correct'); showResult('exact'); }
    else showResult('sqlself');
    return;
  }
  if (p.selfGrade) { showResult('self'); return; }
  const kind = grade(p, ans);
  record(p.id, kind === 'exact' ? 'correct' : 'wrong');
  showResult(kind);
}

function record(id, st) { store.rec[id] = st; save(); renderSide(); }

function showResult(kind, silent) {
  const p = P.find(x => x.id === cur);
  graded = { id: p.id, kind };
  if (kind === null && !silent) record(p.id, 'wrong');
  const ans = p.type === 'blank' ? '' : norm($('#ans').value);
  let blankOk = null;
  if (p.type === 'blank') blankOk = gradeBlanks(p, blankAnswers());
  const nOk = blankOk ? blankOk.filter(Boolean).length : 0;
  const heads = {
    exact: ['정답입니다', p.type === 'code' ? '출력 결과가 정확히 일치해요.' : p.type === 'sql' ? '모범 답안과 같은 SQL문이에요.' : '모두 맞혔어요.'],
    space: ['거의 맞았어요', '내용은 같지만 공백·줄바꿈이 달라요. 실기에서는 공백과 줄바꿈도 채점 대상이라 오답으로 기록했어요.'],
    partial: ['일부만 맞았어요', `${p.blanks ? p.blanks.length : 0}칸 중 ${nOk}칸을 맞혔어요. 실기는 부분 점수가 있기도 하지만, 여기서는 오답 노트에 넣어 둘게요.`],
    wrong: ['틀렸어요', '정답과 해설을 확인해 보세요.'],
    self: ['스스로 채점해 주세요', '반복 출력이 길어서 자동 채점 대신 직접 비교하는 문제예요.'],
    sqlself: ['모범 답안과 비교해 보세요', 'SQL은 같은 뜻을 여러 방식으로 쓸 수 있어서, 모범 답안과 똑같지 않으면 직접 채점해요. 키워드 순서, 조건, 따옴표를 확인하세요.'],
  };
  const h = kind === null ? ['정답 확인', '오답 노트에 넣어 두었어요. 해설을 읽고 다시 풀어 보세요.'] : heads[kind];
  const markKind = kind === 'exact' ? 'exact' : kind === 'space' || kind === 'partial' ? 'space' : kind === 'self' || kind === 'sqlself' ? null : 'wrong';
  const verdict = `<div class="verdict">${markKind ? markSvg(markKind) : ''}<div><h2>${h[0]}</h2><p>${h[1]}</p></div></div>`;
  const explHtml = `<div class="expl"><b>해설</b><p>${esc(p.expl)}</p></div>`;
  const selfBtns = `<div class="selfgrade"><button class="btn ok" type="button" id="self-ok">맞았어요</button><button class="btn bad" type="button" id="self-bad">틀렸어요</button></div>`;
  const overrideBtn = `<div class="selfgrade">답이 맞는데 표기 방식만 달랐나요? <button class="btn ok" type="button" id="override">정답으로 처리</button></div>`;

  if (p.type !== 'code') {
    let body;
    if (p.type === 'blank') {
      const mine = blankAnswers();
      const one = p.blanks.length === 1;
      body = `<div class="tblwrap"><table class="gtable"><thead><tr>${one ? '' : '<th></th>'}${kind !== null ? '<th>내 답</th>' : ''}<th>정답</th>${kind !== null ? '<th></th>' : ''}</tr></thead><tbody>
        ${p.blanks.map((b, i) => `<tr>${one ? '' : `<td class="no">${NUM[i]}</td>`}
          ${kind !== null ? `<td class="mine">${esc(mine[i] || '') || '<span style="color:var(--muted)">(빈칸)</span>'}</td>` : ''}
          <td class="ans">${esc(b.a[0])}${b.a.length > 1 ? `<small>인정: ${esc(b.a.slice(1).join(', '))}</small>` : ''}</td>
          ${kind !== null ? `<td class="v ${blankOk[i] ? 'o' : 'x'}">${blankOk[i] ? '○' : '✕'}</td>` : ''}</tr>`).join('')}
        </tbody></table></div>
        ${p.anyOrder ? '<div class="out"><span class="note">이 문제는 빈칸 순서가 바뀌어도 정답이에요.</span></div>' : ''}`;
    } else {
      body = `<div class="compare">
        ${kind !== null ? `<div class="out"><span>내 답</span><pre>${esc(ans)}</pre></div>` : ''}
        <div class="out right"><span>모범 답안</span><pre>${esc(p.model)}</pre>
          ${p.accept && p.accept.length ? `<div class="note">이렇게 써도 정답: <code>${p.accept.map(esc).join('</code>, <code>')}</code></div>` : ''}</div>
      </div>`;
    }
    $('#result').innerHTML = `<section class="result">${verdict}${body}${explHtml}
      ${kind === 'wrong' || kind === 'partial' ? overrideBtn : ''}${kind === 'sqlself' ? selfBtns : ''}</section>`;
    bindGradeButtons(p, silent);
    return;
  }

  const expected = kind === 'space' ? showSpaces(p.output) : esc(p.output);

  $('#result').innerHTML = `
    <section class="result">
      ${verdict}
      <div class="compare">
        ${kind !== null ? `<div class="out"><span>내 답</span><pre>${kind === 'space' ? showSpaces(ans) : esc(ans)}</pre></div>` : ''}
        <div class="out right"><span>정답 (실행 결과)</span><pre>${expected}</pre>
          ${p.unordered ? '<div class="note">세트는 순서가 없어서 원소 순서가 달라도 정답이에요.</div>' : ''}
          ${p.console ? `<div class="note">실제 콘솔에는 입력 안내 문구까지 붙어서 이렇게 찍혀요: <code>${esc(p.console.replace(/\n/g, ' ⏎ '))}</code></div>` : ''}
        </div>
      </div>
      ${explHtml}
      ${kind === 'wrong' || kind === 'space' ? overrideBtn : ''}
      ${kind === 'self' ? selfBtns : ''}
    </section>`;
  bindGradeButtons(p, silent);
}

function bindGradeButtons(p, silent) {
  const o = $('#override');
  if (o) o.onclick = () => { record(p.id, 'correct'); o.parentElement.innerHTML = '정답으로 기록했어요.'; };
  const so = $('#self-ok'), sb = $('#self-bad');
  if (so) {
    so.onclick = () => { record(p.id, 'correct'); so.parentElement.innerHTML = '정답으로 기록했어요.'; };
    sb.onclick = () => { record(p.id, 'wrong'); sb.parentElement.innerHTML = '오답으로 기록했어요.'; };
  }
  if (!silent) { const r = $('#result .result'); r && r.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' }); }
}

function go(id) {
  cur = id; graded = null; store.cur = id; save(); render();
  $('#sheet').scrollIntoView({ block: 'start', behavior: 'auto' });
}

$('#omr').onclick = e => { const b = e.target.closest('button[data-id]'); if (b) go(+b.dataset.id); };
function askReset() {
  $('#reset').innerHTML = '모든 풀이 기록을 지울까요? <button class="linkbtn danger" type="button" id="reset-yes">지우기</button><button class="linkbtn" type="button" id="reset-no">취소</button>';
  $('#reset-yes').onclick = () => { store.rec = {}; store.draft = {}; save(); graded = null; restoreReset(); render(); };
  $('#reset-no').onclick = restoreReset;
}
function restoreReset() {
  $('#reset').innerHTML = '<button class="linkbtn" id="reset-ask" type="button">풀이 기록 초기화</button>';
  $('#reset-ask').onclick = askReset;
}
$('#reset-ask').onclick = askReset;
if (matchMedia('(max-width: 860px)').matches) $('#mapbox').open = false;

renderFilters();
render();
</script>
</body>
</html>
